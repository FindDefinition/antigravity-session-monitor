<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Session Monitor</title>
  <!-- Antigravity sidecar bridge: injects host theme CSS variables & window.sidecar -->
  <script src="/preload.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --sm-fallback-bg: #fafafa;
      --sm-fallback-fg: #1f2328;
      --sm-fallback-card: rgba(127, 127, 140, 0.06);

      --sm-bg: var(--background, var(--sm-fallback-bg));
      --sm-fg: var(--foreground, var(--sm-fallback-fg));
      --sm-muted: var(--muted-foreground, color-mix(in srgb, var(--sm-fg) 62%, transparent));
      --sm-card: var(--card, var(--sm-fallback-card));
      --sm-border: var(--border, color-mix(in srgb, var(--sm-fg) 16%, transparent));
      --sm-event-bg: color-mix(in srgb, var(--sm-fg) 3%, transparent);
      --sm-track-bg: color-mix(in srgb, var(--sm-fg) 14%, transparent);
      --sm-popover-bg: var(--popover, var(--sm-bg));
      --sm-accent: #2563eb;
      --sm-pro: #9333ea;
      --sm-flash: #059669;
      --sm-warn: #d97706;
      --sm-danger: #dc2626;
      --sm-radius: 8px;
      --sm-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sm-fallback-bg: #141416;
        --sm-fallback-fg: #ececef;
        --sm-fallback-card: rgba(127, 127, 140, 0.08);
        --sm-accent: #4f8cff;
        --sm-pro: #a855f7;
        --sm-flash: #10b981;
        --sm-warn: #f59e0b;
        --sm-danger: #ef4444;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--sm-bg);
      color: var(--sm-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      overflow-y: auto;
    }
    .app {
      height: 100vh;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 12px 10px;
    }
    #content {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sm-muted);
      flex-shrink: 0;
    }
    .dot.live { background: var(--sm-flash); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22); }
    .title {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
    }
    .conv-id {
      font-family: var(--sm-mono);
      font-size: 10px;
      color: var(--sm-muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn {
      background: transparent;
      border: 1px solid var(--sm-border);
      color: var(--sm-muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { color: var(--sm-fg); border-color: var(--sm-muted); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .card {
      background: var(--sm-card);
      border: 1px solid var(--sm-border);
      border-radius: var(--sm-radius);
      padding: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .card.activity-card {
      flex: 1 1 0;
      min-height: 220px;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }
    .card-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sm-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .kpi-val {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .kpi-sub {
      font-size: 11px;
      color: var(--sm-muted);
    }

    .card.ctx-card {
      padding: 7px 10px 8px;
      margin-bottom: 8px;
    }
    .ctx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
    }
    .ctx-head-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .ctx-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sm-muted);
    }
    .ctx-meta {
      font-size: 10px;
      color: var(--sm-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .bar-wrap {
      position: relative;
      padding: 3px 0;
      cursor: default;
    }
    .bar-track {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: var(--sm-track-bg);
      overflow: hidden;
      display: flex;
    }
    .bar-track::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 15%;
      border-left: 1px solid rgba(245, 158, 11, 0.5);
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 3px,
        rgba(245, 158, 11, 0.22) 3px,
        rgba(245, 158, 11, 0.22) 5px
      );
      pointer-events: none;
    }
    .bar-seg {
      height: 100%;
      flex-shrink: 0;
      transition: width 0.25s ease;
    }
    .bar-seg.c-system { background: #8b5cf6; }
    .bar-seg.c-user { background: #3b82f6; }
    .bar-seg.c-assistant { background: #10b981; }
    .bar-seg.c-thinking { background: #f59e0b; }
    .bar-seg.c-tool_calls { background: #f97316; }
    .bar-seg.c-tool_results { background: #f43f5e; }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--sm-accent);
      transition: width 0.25s ease;
    }
    .bar-fill.warn { background: var(--sm-warn); }
    .bar-fill.danger { background: var(--sm-danger); }
    .bar-tooltip {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 5px);
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--sm-popover-bg);
      border: 1px solid var(--sm-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      color: var(--sm-fg);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 35;
    }
    .bar-wrap:hover .bar-tooltip {
      opacity: 1;
      transform: translateY(0);
    }
    .tt-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--sm-border);
    }
    .tt-head-sub {
      font-size: 10px;
      font-weight: 400;
      color: var(--sm-muted);
    }
    .tt-rows {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
    }
    .tt-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .tt-swatch {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tt-swatch.c-system { background: #8b5cf6; }
    .tt-swatch.c-user { background: #3b82f6; }
    .tt-swatch.c-assistant { background: #10b981; }
    .tt-swatch.c-thinking { background: #f59e0b; }
    .tt-swatch.c-tool_calls { background: #f97316; }
    .tt-swatch.c-tool_results { background: #f43f5e; }
    .tt-swatch.c-free { background: var(--sm-track-bg); border: 1px solid var(--sm-border); }
    .tt-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--sm-mono);
      color: var(--sm-muted);
    }
    .tt-pct {
      min-width: 38px;
      text-align: right;
      color: var(--sm-fg);
      font-weight: 600;
    }
    .tt-foot {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed var(--sm-border);
    }

    .meta-line {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--sm-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 999px;
      font-family: var(--sm-mono);
      background: rgba(59, 130, 246, 0.14);
      color: var(--sm-accent);
    }
    .pill.pro { background: rgba(168, 85, 247, 0.14); color: var(--sm-pro); }
    .pill.flash { background: rgba(16, 185, 129, 0.14); color: var(--sm-flash); }
    .pill.ckpt { background: rgba(245, 158, 11, 0.15); color: var(--sm-warn); }
    .pill.user { background: color-mix(in srgb, var(--sm-fg) 12%, transparent); color: var(--sm-fg); }

    .event-badges {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: var(--sm-mono);
    }
    .tag.summary { background: rgba(16, 185, 129, 0.16); color: var(--sm-flash); border: 1px solid rgba(16, 185, 129, 0.35); }
    .tag.progress { background: rgba(59, 130, 246, 0.14); color: var(--sm-accent); border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag.async { background: rgba(6, 182, 212, 0.14); color: #0891b2; border: 1px solid rgba(6, 182, 212, 0.32); }
    .tag.thought { background: color-mix(in srgb, var(--sm-fg) 8%, transparent); color: var(--sm-muted); }
    .tag.tool { background: color-mix(in srgb, var(--sm-fg) 6%, transparent); color: var(--sm-muted); }
    .tag.compact { background: rgba(245, 158, 11, 0.15); color: var(--sm-warn); }

    .model-item {
      padding: 7px 0;
      border-top: 1px solid var(--sm-border);
    }
    .model-item:first-of-type { border-top: none; padding-top: 2px; }
    .model-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .model-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }
    .stat-cell {
      display: flex;
      flex-direction: column;
    }
    .stat-k { font-size: 9px; color: var(--sm-muted); text-transform: uppercase; }
    .stat-v { font-size: 11px; font-weight: 600; }

    .switch-banner {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--sm-border);
      font-size: 11px;
      color: var(--sm-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }

    /* Filter chips */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
      align-items: center;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--sm-border);
      background: transparent;
      color: var(--sm-muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .chip:hover { color: var(--sm-fg); border-color: var(--sm-muted); }
    .chip .cnt {
      font-family: var(--sm-mono);
      font-size: 9px;
      opacity: 0.75;
    }
    .chip .unread-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sm-danger);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--sm-danger) 22%, transparent);
    }
    .chip.active {
      background: color-mix(in srgb, var(--sm-fg) 10%, transparent);
      color: var(--sm-fg);
      border-color: color-mix(in srgb, var(--sm-fg) 30%, transparent);
    }
    .chip.active.k-summary { background: rgba(16, 185, 129, 0.16); color: var(--sm-flash); border-color: rgba(16, 185, 129, 0.45); }
    .chip.active.k-progress { background: rgba(59, 130, 246, 0.15); color: var(--sm-accent); border-color: rgba(59, 130, 246, 0.45); }
    .chip.active.k-async { background: rgba(6, 182, 212, 0.15); color: #0891b2; border-color: rgba(6, 182, 212, 0.45); }
    .chip.active.k-compact { background: rgba(245, 158, 11, 0.15); color: var(--sm-warn); border-color: rgba(245, 158, 11, 0.45); }

    /* Antigravity-style user-prompt dot rail (left) + paged feed (right) */
    .feed-shell {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .turn-rail {
      width: 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      max-height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 6px 0;
      user-select: none;
    }
    .turn-rail::-webkit-scrollbar { display: none; }
    .turn-dot-btn {
      width: 14px;
      height: 12px;
      padding: 0;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .turn-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--sm-fg) 26%, transparent);
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .turn-dot-btn:hover .turn-dot {
      transform: scale(1.55);
      background: color-mix(in srgb, var(--sm-fg) 68%, transparent);
    }
    .turn-dot-btn.active .turn-dot {
      width: 6px;
      height: 6px;
      background: var(--sm-fg);
    }

    /* Antigravity-style floating turn preview card */
    .turn-popover {
      position: absolute;
      left: 22px;
      top: 0;
      width: min(268px, calc(100% - 26px));
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--sm-popover-bg);
      border: 1px solid var(--sm-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      pointer-events: none;
      z-index: 30;
      display: none;
    }
    .turn-popover.show { display: block; }
    .turn-pop-prompt {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--sm-fg);
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .turn-pop-reply {
      font-size: 11px;
      line-height: 1.4;
      color: var(--sm-muted);
      margin-bottom: 7px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .turn-pop-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--sm-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Paged scrollable feed */
    .feed {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* Event cards & inline full-message expansion */
    .event {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--sm-border);
      background: var(--sm-event-bg);
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .event.is-summary { border-left: 3px solid var(--sm-flash); }
    .event.is-progress { border-left: 3px solid var(--sm-accent); }
    .event.highlight {
      border-color: var(--sm-accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.24);
    }
    .event-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .event-time {
      font-size: 10px;
      color: var(--sm-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .event-tools {
      font-family: var(--sm-mono);
      font-size: 10px;
      color: var(--sm-muted);
      margin-bottom: 2px;
      word-break: break-word;
    }
    .event-text {
      font-size: 11px;
      word-break: break-word;
    }
    .event-text.thought {
      color: var(--sm-muted);
      font-style: italic;
    }
    .event-text.full {
      white-space: pre-wrap;
      font-style: normal;
      color: var(--sm-fg);
      max-height: 280px;
      overflow-y: auto;
      padding: 6px 8px;
      margin-top: 4px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--sm-fg) 4%, transparent);
      border: 1px solid var(--sm-border);
    }
    .event-text.full.thought-full {
      color: var(--sm-muted);
      font-style: italic;
    }
    .event-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--sm-accent);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .link-btn:hover { text-decoration: underline; }
    .link-btn.muted { color: var(--sm-muted); }

    /* Page navigator */
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--sm-border);
      font-size: 10px;
      color: var(--sm-muted);
    }
    .pager-btns {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pager .btn {
      padding: 2px 6px;
      font-size: 10px;
    }
    .btn.has-new {
      border-color: var(--sm-accent);
      color: var(--sm-accent);
      font-weight: 600;
    }

    .empty {
      text-align: center;
      padding: 28px 12px;
      color: var(--sm-muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title-wrap">
        <span id="liveDot" class="dot"></span>
        <span class="title">Session Monitor</span>
        <span id="convId" class="conv-id"></span>
      </div>
      <button id="refreshBtn" class="btn" type="button" title="Click to refresh stats · Shift+Click to reload UI">Refresh</button>
    </div>

    <div id="emptyState" class="empty">Waiting for active conversation…</div>

    <div id="content" style="display:none">
      <div id="ctxCard" class="card ctx-card"></div>
      <div id="modelsCard" class="card"></div>
      <div class="card activity-card">
        <div class="card-label">
          <span>Live Activity</span>
          <span id="lastUpdated"></span>
        </div>
        <div id="filterBar" class="filter-bar"></div>
        <div class="feed-shell">
          <div id="turnRail" class="turn-rail" aria-label="User prompt navigator"></div>
          <div id="feedList" class="feed"></div>
          <div id="turnPopover" class="turn-popover">
            <div id="turnPopPrompt" class="turn-pop-prompt"></div>
            <div id="turnPopReply" class="turn-pop-reply"></div>
            <div class="turn-pop-foot">
              <span id="turnPopCount"></span>
              <span id="turnPopTime"></span>
            </div>
          </div>
        </div>
        <div id="pager" class="pager"></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const getConvId = () => window.sidecar?.conversationId || params.get('conversationId') || '';

      const ALL_KINDS = ['summary', 'progress', 'user', 'compact', 'async', 'thought', 'tool'];
      const DEFAULT_KINDS = ['summary', 'progress', 'user', 'compact'];
      const KIND_LABELS = {
        summary: 'Summary',
        progress: 'Progress',
        user: 'User',
        compact: 'Compact',
        async: 'Async',
        thought: 'Thought',
        tool: 'Tool',
      };
      const PAGE_SIZE = 30;
      const STORAGE_KEY = 'session_monitor_active_kinds_v1';

      function loadSavedKinds() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length) {
              const valid = arr.filter((k) => ALL_KINDS.includes(k));
              if (valid.length) return new Set(valid);
            }
          }
        } catch {}
        return new Set(DEFAULT_KINDS);
      }

      function saveKinds(set) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
        } catch {}
      }

      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[c]));

      const fmtTok = (n) => {
        const v = Number(n) || 0;
        if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
        if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
        if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
        return String(v);
      };

      const fmtPct = (v) => (v == null || Number.isNaN(v) ? '—' : v.toFixed(1) + '%');
      const fmtTps = (v) => (v == null || Number.isNaN(v) ? '—' : v.toFixed(1) + '/s');

      const fmtTime = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      };

      const fmtShortTime = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      };

      const fmtElapsed = (iso) => {
        if (!iso) return '';
        const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
        if (sec < 60) return `${sec}s ago`;
        const m = Math.floor(sec / 60);
        if (m < 60) return `${m}m ago`;
        return `${Math.floor(m / 60)}h ${m % 60}m ago`;
      };

      const modelClass = (name) => {
        const n = String(name || '').toLowerCase();
        if (n.includes('checkpoint')) return 'ckpt';
        if (n.includes('pro') || n.includes('orchestrator')) return 'pro';
        if (n.includes('flash') || n.includes('worker')) return 'flash';
        return '';
      };

      const shortModel = (name) => {
        if (!name) return 'unknown';
        return name
          .replace('gemini-pro-orchestrator', 'pro-orchestrator')
          .replace('gemini-flash-worker-agy', 'flash-worker');
      };

      async function fetchJson(path) {
        const f = window.sidecar?.fetch ? window.sidecar.fetch.bind(window.sidecar) : fetch;
        const res = await f(path, { method: 'GET' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      let lastConv = '';
      let lastEtag = '';
      let lastStats = null;
      let lastActivity = null;
      let activeKinds = loadSavedKinds();
      let followLatest = true;
      let currentPage = 1;
      let hasNewOnLatest = false;
      let hasRenderedFeed = false;
      let activeTurnIdx = -1;
      let pendingJumpStep = null;
      let seenKindCounts = null; // Baseline counts per kind; unread red dot appears when a disabled kind grows

      // Full-message expansion state (persists across 2s polls)
      const expandedSteps = new Set();
      const showThinkingSteps = new Set();
      const fullStepCache = new Map();

      const dotEl = document.getElementById('liveDot');
      const convEl = document.getElementById('convId');
      const emptyEl = document.getElementById('emptyState');
      const contentEl = document.getElementById('content');
      const ctxCardEl = document.getElementById('ctxCard');
      const modelsCardEl = document.getElementById('modelsCard');
      const lastUpdatedEl = document.getElementById('lastUpdated');
      const filterBarEl = document.getElementById('filterBar');
      const turnRailEl = document.getElementById('turnRail');
      const turnPopEl = document.getElementById('turnPopover');
      const turnPopPromptEl = document.getElementById('turnPopPrompt');
      const turnPopReplyEl = document.getElementById('turnPopReply');
      const turnPopCountEl = document.getElementById('turnPopCount');
      const turnPopTimeEl = document.getElementById('turnPopTime');
      const feedEl = document.getElementById('feedList');
      const pagerEl = document.getElementById('pager');

      function updateMetaOnly(stats) {
        if (!stats || !stats.found) return;
        const ageMs = stats.lastAt ? Date.now() - new Date(stats.lastAt).getTime() : Infinity;
        dotEl.classList.toggle('live', ageMs < 60_000);
        lastUpdatedEl.textContent = stats.lastAt ? `updated ${fmtElapsed(stats.lastAt)}` : '';
      }

      function syncSeenCounts(kindCounts) {
        const counts = kindCounts || {};
        if (!seenKindCounts) {
          seenKindCounts = { ...counts };
          return;
        }
        for (const k of ALL_KINDS) {
          const c = counts[k] || 0;
          if (activeKinds.has(k) || seenKindCounts[k] === undefined) {
            seenKindCounts[k] = c;
          }
        }
      }

      function renderFilterBar(kindCounts) {
        const counts = kindCounts || {};
        syncSeenCounts(counts);
        const visibleKinds = ALL_KINDS.filter((k) => (counts[k] || 0) > 0);
        const allSelected = visibleKinds.length > 0 && visibleKinds.every((k) => activeKinds.has(k));
        const chipsHtml = visibleKinds
          .map((k) => {
            const on = activeKinds.has(k);
            const c = counts[k] || 0;
            const hasUnread = !on && c > (seenKindCounts?.[k] ?? c);
            const dotHtml = hasUnread ? '<span class="unread-dot" title="New items since last viewed"></span>' : '';
            return `<button type="button" class="chip k-${k}${on ? ' active' : ''}" data-kind="${k}">${KIND_LABELS[k]} <span class="cnt">${c}</span>${dotHtml}</button>`;
          })
          .join('');
        const allBtn = visibleKinds.length > 1
          ? `<button type="button" class="chip${allSelected ? ' active' : ''}" data-preset="${allSelected ? 'milestones' : 'all'}" title="${allSelected ? 'Reset to default filters (Summary, Progress, User, Compact)' : 'Show all event types'}">All</button>`
          : '';
        filterBarEl.innerHTML = chipsHtml + allBtn;
      }

      function renderStats(stats) {
        const conv = stats?.conversationId || getConvId();
        convEl.textContent = conv ? conv.slice(0, 8) : '';

        if (!stats || !stats.found) {
          dotEl.classList.remove('live');
          contentEl.style.display = 'none';
          emptyEl.style.display = 'block';
          emptyEl.textContent = conv
            ? 'No transcript yet for this conversation.'
            : 'Open a conversation to monitor token usage.';
          hasRenderedFeed = false;
          return;
        }

        emptyEl.style.display = 'none';
        contentEl.style.display = 'flex';
        updateMetaOnly(stats);
        renderFilterBar(stats.kindCounts);

        const ctx = stats.currentContext || {};
        const tot = stats.totals || {};
        const sw = stats.switches || {};
        const pctComp = Math.min(100, ((ctx.inputTokens || 0) / (ctx.compactionRef || 500_000)) * 100);
        const barCls = pctComp >= 85 ? 'danger' : pctComp >= 65 ? 'warn' : '';

        const compRef = ctx.compactionRef || 500_000;
        const usedTok = ctx.inputTokens || 0;
        const freeTok = Math.max(0, compRef - usedTok);
        const freePct = Math.max(0, 100 - pctComp);
        const comp = Array.isArray(ctx.composition) && ctx.composition.length ? ctx.composition : null;

        // Scale segment widths so they sum to pctComp (capped at 100% of bar width)
        let barInnerHtml = '';
        if (comp && usedTok > 0) {
          const scaleFactor = pctComp / 100;
          barInnerHtml = comp
            .map((p) => {
              const w = Math.max(0, p.pctOfContext * scaleFactor);
              return `<div class="bar-seg c-${esc(p.key)}" style="width:${w.toFixed(2)}%"></div>`;
            })
            .join('');
        } else {
          barInnerHtml = `<div class="bar-fill ${barCls}" style="width:${pctComp.toFixed(1)}%"></div>`;
        }

        const ttRowsHtml = comp
          ? comp
              .map(
                (p) => `
                  <div class="tt-row">
                    <span class="tt-left"><span class="tt-swatch c-${esc(p.key)}"></span><span>${esc(p.label)}</span></span>
                    <span class="tt-right"><span>${fmtTok(p.tokens)}</span><span class="tt-pct">${p.pctOfContext.toFixed(1)}%</span></span>
                  </div>`,
              )
              .join('')
          : '';

        const ttFootHtml = `
          <div class="tt-row tt-foot">
            <span class="tt-left"><span class="tt-swatch c-free"></span><span>Free (to ~${fmtTok(compRef)})</span></span>
            <span class="tt-right"><span>${fmtTok(freeTok)}</span><span class="tt-pct">${freePct.toFixed(1)}%</span></span>
          </div>`;

        ctxCardEl.innerHTML = `
          <div class="ctx-head">
            <span class="ctx-head-left">
              <span class="ctx-title">Context</span>
              ${ctx.model ? `<span class="pill ${modelClass(ctx.model)}">${esc(shortModel(ctx.model))}</span>` : ''}
            </span>
            <span class="ctx-meta">${stats.checkpoints || 0} compactions · ${tot.steps || 0} calls</span>
          </div>
          <div class="bar-wrap">
            <div class="bar-track">${barInnerHtml}</div>
            <div class="bar-tooltip">
              <div class="tt-head">
                <span>${fmtTok(usedTok)} / ~${fmtTok(compRef)} (${pctComp.toFixed(1)}%)</span>
                <span class="tt-head-sub">+${fmtTok(ctx.outputTokens)} out</span>
              </div>
              <div class="tt-rows">${ttRowsHtml}${ttFootHtml}</div>
            </div>
          </div>
        `;

        const visibleModels = (stats.models || []).filter(
          (m) => !String(m.name || '').toLowerCase().includes('checkpoint'),
        );
        const modelsHtml = visibleModels
          .map((m) => {
            const cls = modelClass(m.name);
            return `
              <div class="model-item">
                <div class="model-head">
                  <span class="pill ${cls}" title="${esc(m.name)}">${esc(shortModel(m.name))}</span>
                  <span class="kpi-sub">${m.steps} steps · hit <strong>${fmtPct(m.cacheHitRate)}</strong></span>
                </div>
                <div class="model-grid">
                  <div class="stat-cell"><span class="stat-k">Uncached</span><span class="stat-v">${fmtTok(m.uncachedInput)}</span></div>
                  <div class="stat-cell"><span class="stat-k">Cached</span><span class="stat-v">${fmtTok(m.cacheRead)}</span></div>
                  <div class="stat-cell"><span class="stat-k">Output</span><span class="stat-v">${fmtTok(m.output)}</span></div>
                  <div class="stat-cell"><span class="stat-k">Max Ctx</span><span class="stat-v">${fmtTok(m.maxContext)}</span></div>
                  <div class="stat-cell" title="${m.tpsSamples ? `Historical output tok/s across ${m.tpsSamples} timed step${m.tpsSamples === 1 ? '' : 's'}` : 'No timed tool-calling steps yet'}"><span class="stat-k">TPS</span><span class="stat-v">${fmtTps(m.tps)}</span></div>
                </div>
              </div>
            `;
          })
          .join('');

        const switchHtml =
          sw.count > 0
            ? `<div class="switch-banner">
                 <span>Model switches: <strong>${sw.count}</strong> (${fmtTok(sw.uncachedInput)} uncached)</span>
                 <span>Switch hit: <strong>${fmtPct(sw.cacheHitRate)}</strong> vs same: <strong>${fmtPct(sw.sameModelHitRate)}</strong></span>
               </div>`
            : '';

        modelsCardEl.innerHTML = `
          <div class="card-label">
            <span>Per-Model Tokens</span>
            <span>Total ${fmtTok(tot.grandTotal)} (${fmtTok(tot.uncachedInput)} uncached)</span>
          </div>
          ${modelsHtml || '<div class="kpi-sub">No model calls yet.</div>'}
          ${switchHtml}
        `;
      }

      const KIND_META = {
        summary: { label: 'SUMMARY', cls: 'summary', title: 'Final reply shown in chat' },
        progress: { label: 'PROGRESS', cls: 'progress', title: 'Mid-task progress update emitted alongside tool calls' },
        async: { label: 'ASYNC', cls: 'async', title: 'Turn yielded while awaiting a background task or subagent' },
        thought: { label: 'THOUGHT', cls: 'thought', title: 'Internal reasoning headline (collapsed in chat)' },
        tool: { label: 'TOOL', cls: 'tool', title: 'Tool-only step' },
        compact: { label: 'COMPACT', cls: 'compact', title: 'Context compaction checkpoint' },
      };

      function renderEventBody(ev) {
        const isExpanded = expandedSteps.has(ev.stepIndex);
        const cached = fullStepCache.get(ev.stepIndex);
        const tools = (isExpanded && cached?.tools?.length ? cached.tools : ev.tools) || [];
        const toolsStr = tools.length
          ? `<div class="event-tools">${esc((isExpanded ? tools : tools.slice(0, 4)).join(' · '))}${
              !isExpanded && tools.length > 4 ? ` (+${tools.length - 4})` : ''
            }</div>`
          : '';

        let bodyHtml = '';
        if (isExpanded) {
          if (!cached) {
            bodyHtml = `<div class="event-text thought">Loading full message…</div>`;
          } else {
            const mainText = cached.content || cached.thinking || ev.text || '';
            const isThoughtOnly = !cached.content && Boolean(cached.thinking);
            if (mainText) {
              bodyHtml += `<div class="event-text full${isThoughtOnly ? ' thought-full' : ''}">${esc(mainText)}</div>`;
            }
            const showTh = showThinkingSteps.has(ev.stepIndex);
            if (cached.content && cached.thinking && showTh) {
              bodyHtml += `<div class="event-text full thought-full">${esc(cached.thinking)}</div>`;
            }
            bodyHtml += `<div class="event-actions">
              <button type="button" class="link-btn" data-action="collapse" data-step="${ev.stepIndex}">Collapse ▴</button>
              ${cached.content && cached.thinking ? `<button type="button" class="link-btn muted" data-action="toggle-thinking" data-step="${ev.stepIndex}">${showTh ? 'Hide thinking' : 'Show thinking'}</button>` : ''}
              <button type="button" class="link-btn muted" data-action="copy" data-step="${ev.stepIndex}">Copy</button>
            </div>`;
          }
        } else {
          if (ev.text) {
            bodyHtml += `<div class="event-text ${ev.isThought ? 'thought' : ''}">${esc(ev.text)}</div>`;
          }
          if (ev.truncated || ev.hasThinking) {
            bodyHtml += `<div class="event-actions">
              <button type="button" class="link-btn" data-action="expand" data-step="${ev.stepIndex}">Expand full ▾</button>
            </div>`;
          }
        }
        return toolsStr + bodyHtml;
      }

      function updateActiveDotFromScroll() {
        const cards = feedEl.querySelectorAll('.event[data-turn]');
        if (!cards.length) return;
        const feedTop = feedEl.getBoundingClientRect().top;
        let visibleTurn = parseInt(cards[0].dataset.turn, 10);
        for (const card of cards) {
          const rect = card.getBoundingClientRect();
          if (rect.bottom > feedTop + 16) {
            visibleTurn = parseInt(card.dataset.turn, 10);
            break;
          }
        }
        if (Number.isFinite(visibleTurn) && visibleTurn !== activeTurnIdx) {
          activeTurnIdx = visibleTurn;
          const prev = turnRailEl.querySelector('.turn-dot-btn.active');
          if (prev) prev.classList.remove('active');
          const cur = turnRailEl.querySelector(`.turn-dot-btn[data-turn-i="${activeTurnIdx}"]`);
          if (cur) cur.classList.add('active');
        }
      }

      function renderTurnRail(turns) {
        if (!turns || !turns.length) {
          turnRailEl.style.display = 'none';
          turnRailEl.innerHTML = '';
          return;
        }
        turnRailEl.style.display = 'flex';
        turnRailEl.innerHTML = turns
          .map((t, i) => {
            const isActive = t.turnIndex === activeTurnIdx;
            return `<button type="button" class="turn-dot-btn${isActive ? ' active' : ''}" data-turn-i="${i}" aria-label="Prompt ${i + 1} of ${turns.length}"><span class="turn-dot"></span></button>`;
          })
          .join('');
      }

      function renderActivity(act, { preserveScroll = true } = {}) {
        if (!act || !act.found) return;
        lastActivity = act;
        currentPage = act.page;

        const wasAtBottom =
          !hasRenderedFeed ||
          feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 24;
        const prevScrollTop = feedEl.scrollTop;

        const items = act.items || [];
        if (items.length === 0) {
          feedEl.innerHTML = '<div class="kpi-sub" style="padding:12px 4px">No matching events. Toggle another filter above (e.g. Thought or All).</div>';
        } else {
          feedEl.innerHTML = items
            .map((ev) => {
              const isUser = ev.type === 'USER_INPUT';
              const pillCls = isUser ? 'user' : modelClass(ev.model);
              const label = isUser ? 'USER' : shortModel(ev.model);
              const km = !isUser && ev.kind ? KIND_META[ev.kind] : null;
              const tagHtml = km
                ? `<span class="tag ${km.cls}" title="${esc(km.title)}">${km.label}</span>`
                : '';
              const cardCls = ev.kind === 'summary' ? ' is-summary' : ev.kind === 'progress' ? ' is-progress' : '';
              const ctxStr = ev.contextTokens ? ` · ${fmtTok(ev.contextTokens)}` : '';
              return `
                <div class="event${cardCls}" data-step="${ev.stepIndex}" data-turn="${ev.turnIndex ?? 0}">
                  <div class="event-head">
                    <span class="event-badges">
                      <span class="pill ${pillCls}">${esc(label)}</span>
                      ${tagHtml}
                    </span>
                    <span class="event-time">#${ev.stepIndex}${ctxStr} · ${fmtTime(ev.createdAt)}</span>
                  </div>
                  ${renderEventBody(ev)}
                </div>
              `;
            })
            .join('');
        }

        renderTurnRail(act.turns || []);

        const rangeStr = act.totalFiltered > 0 ? `${act.startIndex + 1}–${act.endIndex} of ${act.totalFiltered}` : '0 events';
        pagerEl.innerHTML = `
          <span>Pg ${act.page}/${act.totalPages} · ${rangeStr}</span>
          <span class="pager-btns">
            <button type="button" class="btn" data-nav="first" ${act.page <= 1 ? 'disabled' : ''} title="First page">«</button>
            <button type="button" class="btn" data-nav="prev" ${act.page <= 1 ? 'disabled' : ''} title="Previous page">‹</button>
            <button type="button" class="btn" data-nav="next" ${act.page >= act.totalPages ? 'disabled' : ''} title="Next page">›</button>
            <button type="button" class="btn${hasNewOnLatest ? ' has-new' : ''}" data-nav="latest" ${followLatest && act.page >= act.totalPages ? 'disabled' : ''} title="Jump to latest">${hasNewOnLatest ? 'New »' : 'Latest »'}</button>
          </span>
        `;

        if (pendingJumpStep !== null) {
          const target = feedEl.querySelector(`.event[data-step="${pendingJumpStep}"]`);
          pendingJumpStep = null;
          if (target) {
            target.scrollIntoView({ block: 'start' });
            target.classList.add('highlight');
            setTimeout(() => target.classList.remove('highlight'), 1400);
          }
        } else if (!preserveScroll || (followLatest && wasAtBottom)) {
          feedEl.scrollTop = feedEl.scrollHeight;
        } else {
          feedEl.scrollTop = prevScrollTop;
        }
        hasRenderedFeed = true;
        updateActiveDotFromScroll();
      }

      async function fetchActivity({ page = followLatest ? 'latest' : String(currentPage), preserveScroll = true } = {}) {
        const conv = getConvId();
        if (!conv) return;
        const q = new URLSearchParams({
          conversationId: conv,
          kinds: [...activeKinds].join(','),
          page: String(page),
          pageSize: String(PAGE_SIZE),
        });
        const act = await fetchJson(`/api/activity?${q.toString()}`);
        if (act.found) {
          if (page === 'latest') hasNewOnLatest = false;
          renderActivity(act, { preserveScroll });
        }
      }

      async function expandStep(stepIndex) {
        expandedSteps.add(stepIndex);
        if (!fullStepCache.has(stepIndex)) {
          if (lastActivity) renderActivity(lastActivity, { preserveScroll: true });
          const conv = getConvId();
          try {
            const rec = await fetchJson(`/api/step?conversationId=${encodeURIComponent(conv)}&stepIndex=${stepIndex}`);
            if (rec.found) fullStepCache.set(stepIndex, rec);
          } catch {}
        }
        if (lastActivity) renderActivity(lastActivity, { preserveScroll: true });
      }

      // Sync active dot while scrolling within the current page
      let scrollRaf = false;
      feedEl.addEventListener('scroll', () => {
        if (!scrollRaf) {
          scrollRaf = true;
          requestAnimationFrame(() => {
            scrollRaf = false;
            updateActiveDotFromScroll();
          });
        }
      });

      // Filter bar interactions
      filterBarEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-kind], button[data-preset]');
        if (!btn) return;
        const preset = btn.dataset.preset;
        if (preset === 'all') {
          activeKinds = new Set(ALL_KINDS);
        } else if (preset === 'milestones') {
          activeKinds = new Set(DEFAULT_KINDS);
        } else if (btn.dataset.kind) {
          const k = btn.dataset.kind;
          if (activeKinds.has(k)) {
            if (activeKinds.size > 1) activeKinds.delete(k);
          } else {
            activeKinds.add(k);
          }
        }
        saveKinds(activeKinds);
        followLatest = true;
        hasNewOnLatest = false;
        if (lastStats) renderFilterBar(lastStats.kindCounts);
        fetchActivity({ page: 'latest', preserveScroll: false });
      });

      // Event card expand/collapse/copy interactions
      feedEl.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const step = parseInt(btn.dataset.step, 10);
        if (!Number.isFinite(step)) return;

        if (action === 'expand') {
          await expandStep(step);
        } else if (action === 'collapse') {
          expandedSteps.delete(step);
          if (lastActivity) renderActivity(lastActivity, { preserveScroll: true });
        } else if (action === 'toggle-thinking') {
          if (showThinkingSteps.has(step)) showThinkingSteps.delete(step);
          else showThinkingSteps.add(step);
          if (lastActivity) renderActivity(lastActivity, { preserveScroll: true });
        } else if (action === 'copy') {
          const rec = fullStepCache.get(step);
          const txt = rec?.content || rec?.thinking || '';
          if (txt && navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(txt);
              btn.textContent = 'Copied!';
              setTimeout(() => { btn.textContent = 'Copy'; }, 1000);
            } catch {}
          }
        }
      });

      // Antigravity-style user-prompt dot rail hover preview & click-to-jump
      turnRailEl.addEventListener('mousemove', (e) => {
        const btn = e.target.closest('.turn-dot-btn');
        const turns = lastActivity?.turns || [];
        if (!btn || !turns.length) {
          turnPopEl.classList.remove('show');
          return;
        }
        const i = parseInt(btn.dataset.turnI, 10);
        const t = turns[i];
        if (!t) return;

        turnPopPromptEl.textContent = t.prompt || '(empty prompt)';
        if (t.replyPreview) {
          turnPopReplyEl.textContent = t.replyPreview;
          turnPopReplyEl.style.display = '';
        } else {
          turnPopReplyEl.style.display = 'none';
        }
        turnPopCountEl.textContent = `${i + 1} of ${turns.length}`;
        turnPopTimeEl.textContent = fmtShortTime(t.createdAt);
        turnPopEl.classList.add('show');

        const shellRect = turnRailEl.parentElement.getBoundingClientRect();
        const dotRect = btn.getBoundingClientRect();
        const popH = turnPopEl.offsetHeight || 96;
        const rawTop = dotRect.top - shellRect.top + dotRect.height / 2 - popH / 2;
        const clampedTop = Math.max(0, Math.min(shellRect.height - popH, rawTop));
        turnPopEl.style.top = `${clampedTop}px`;
      });

      turnRailEl.addEventListener('mouseleave', () => {
        turnPopEl.classList.remove('show');
      });

      turnRailEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.turn-dot-btn');
        const turns = lastActivity?.turns || [];
        if (!btn || !turns.length) return;
        const i = parseInt(btn.dataset.turnI, 10);
        const t = turns[i];
        if (!t || t.targetStepIndex < 0) return;

        turnPopEl.classList.remove('show');
        followLatest = t.page >= (lastActivity?.totalPages || 1);
        pendingJumpStep = t.targetStepIndex;
        if (t.page === currentPage) {
          renderActivity(lastActivity, { preserveScroll: true });
        } else {
          fetchActivity({ page: t.page, preserveScroll: true });
        }
      });

      // Page navigator clicks
      pagerEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-nav]');
        if (!btn || btn.disabled || !lastActivity) return;
        const nav = btn.dataset.nav;
        if (nav === 'first') {
          followLatest = false;
          fetchActivity({ page: 1, preserveScroll: false });
        } else if (nav === 'prev') {
          followLatest = false;
          fetchActivity({ page: Math.max(1, currentPage - 1), preserveScroll: false });
        } else if (nav === 'next') {
          const next = Math.min(lastActivity.totalPages, currentPage + 1);
          followLatest = next >= lastActivity.totalPages;
          fetchActivity({ page: next, preserveScroll: false });
        } else if (nav === 'latest') {
          followLatest = true;
          hasNewOnLatest = false;
          fetchActivity({ page: 'latest', preserveScroll: false });
        }
      });

      async function poll(force = false) {
        const conv = getConvId();
        if (conv !== lastConv) {
          lastConv = conv;
          lastEtag = '';
          lastStats = null;
          lastActivity = null;
          followLatest = true;
          hasNewOnLatest = false;
          hasRenderedFeed = false;
          activeTurnIdx = -1;
          seenKindCounts = null;
          expandedSteps.clear();
          showThinkingSteps.clear();
          fullStepCache.clear();
        }
        if (!conv) {
          renderStats(null);
          return;
        }
        const q = new URLSearchParams({ conversationId: conv });
        if (!force && lastEtag) q.set('etag', lastEtag);
        try {
          const res = await fetchJson(`/api/stats?${q.toString()}`);
          if (res.unchanged && lastStats) {
            updateMetaOnly(lastStats);
            return;
          }
          lastEtag = res.etag || '';
          lastStats = res;
          renderStats(res);
          if (res.found) {
            if (followLatest || !lastActivity) {
              await fetchActivity({ page: 'latest', preserveScroll: true });
            } else {
              hasNewOnLatest = true;
              renderActivity(lastActivity, { preserveScroll: true });
            }
          }
        } catch (err) {
          contentEl.style.display = 'none';
          emptyEl.style.display = 'block';
          emptyEl.textContent = `Error loading stats: ${err.message}`;
        }
      }

      document.getElementById('refreshBtn').addEventListener('click', (e) => {
        if (e.shiftKey) {
          location.reload();
          return;
        }
        poll(true);
      });
      poll(true);
      setInterval(() => poll(false), 2000);
    })();
  </script>
</body>
</html>
